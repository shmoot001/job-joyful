name: Email Notifications

on:
  schedule:
    # Daily emails at 07:00 UTC
    - cron: '0 7 * * *'
    # Weekly emails on Sundays at 08:00 UTC  
    - cron: '0 8 * * 0'
  workflow_dispatch: # Allow manual triggering

jobs:
  send-daily-emails:
    if: github.event.schedule == '0 7 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Send Daily Summary Emails
        run: |
          curl -X POST \
            "https://sypmwbybrcuxmnouzjwu.supabase.co/functions/v1/send-summary-email" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN5cG13YnlicmN1eG1ub3V6and1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTU3MjA0MDksImV4cCI6MjA3MTI5NjQwOX0.vmnpkuQw7KwaTQELlxb8Di7YPj0ulSBYs5Rhy09VcX0" \
            -d '{"type": "daily", "only_user": false}'

  send-weekly-emails:
    if: github.event.schedule == '0 8 * * 0' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Send Weekly Summary Emails
        run: |
          curl -X POST \
            "https://sypmwbybrcuxmnouzjwu.supabase.co/functions/v1/send-summary-email" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN5cG13YnlicmN1eG1ub3V6and1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTU3MjA0MDksImV4cCI6MjA3MTI5NjQwOX0.vmnpkuQw7KwaTQELlxb8Di7YPj0ulSBYs5Rhy09VcX0" \
            -d '{"type": "weekly", "only_user": false}'